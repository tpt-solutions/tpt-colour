# cargo-deny policy for the shipped crates.
# Run with: cargo deny check

[graph]
# Only the shipped crates matter; the oracle is excluded from the workspace.
exclude-dev = false

[advisories]
version = 2

[licenses]
version = 2
# Every crate in the shipped dependency graph must be permissively licensed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No C-FFI in shipped crates: LittleCMS lives only in the excluded oracle crate.
# Build-script and binding tooling that would pull C sources in is banned outright.
deny = [
    { crate = "cc", reason = "C build tooling; shipped crates are pure Rust" },
    { crate = "cmake", reason = "C build tooling; shipped crates are pure Rust" },
    { crate = "bindgen", reason = "C binding generator; shipped crates are pure Rust" },
    { crate = "pkg-config", reason = "C library discovery; shipped crates are pure Rust" },
    { crate = "lcms2-sys", reason = "LittleCMS FFI; oracle-only" },
    { crate = "lcms2", reason = "LittleCMS binding; oracle-only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
