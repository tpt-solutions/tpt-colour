name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test and lint (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  msrv:
    name: Minimum supported Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  no-std:
    name: no_std target (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude tpt-colour-cli --target thumbv7em-none-eabihf

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude tpt-colour-cli --target wasm32-unknown-unknown

  determinism:
    # Bit-exact outputs must match x86-64 (see crates/tpt-colour-manage/tests/determinism.rs).
    name: Determinism on ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tpt-colour-manage --test determinism --test golden

  oracle:
    # LittleCMS parity. Profiles are not in the repository, so these tests skip unless
    # TPT_ICC_DIR points at a directory with RSWOP.icm and ewrgb18.icm.
    name: LittleCMS oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path crates/tpt-colour-oracle/Cargo.toml

  fuzz-smoke:
    name: Fuzz smoke (60 s per target, four targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - working-directory: fuzz
        run: |
          for target in icc_parse lut_eval transform_full parse_css; do
            cargo fuzz run "$target" -- -max_total_time=60
          done

  simd:
    # The `simd` feature needs Rust 1.95 (tpt-simd's minimum), so it is tested on stable,
    # not in the 1.85 MSRV job.
    name: Tests with simd feature (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features tpt-colour/simd

  coverage:
    name: Coverage (cargo-llvm-cov, lcov artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  feature-powerset:
    # `simd` is left out: it needs a git dependency and Rust 1.95, and has its own job above.
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --workspace --feature-powerset --exclude-features simd --no-dev-deps

  wasm-tests:
    name: WebAssembly tests (Node) and playground build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
      - run: wasm-pack test --node crates/tpt-colour-wasm
      - name: Build the playground package
        run: wasm-pack build crates/tpt-colour-wasm --target web --out-dir ../../playground/pkg --release
      - name: Smoke-test the generated module
        run: node playground/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        working-directory: crates/tpt-colour-py
        run: |
          python -m pip install maturin
          maturin build --release -o dist
      - name: Install and test
        working-directory: crates/tpt-colour-py
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m unittest discover -s tests -v

  c-abi:
    name: C ABI (build, header in sync, ctypes tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspace: crates/tpt-colour-capi -> target
      - name: Unit tests and release build
        working-directory: crates/tpt-colour-capi
        run: |
          cargo test
          cargo build --release
      - name: The committed header matches the Rust source
        working-directory: crates/tpt-colour-capi
        run: |
          cbindgen --config cbindgen.toml --crate tpt-colour-capi --output include/tpt_colour.h
          git diff --exit-code -- include/tpt_colour.h
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Call the library through ctypes
        working-directory: crates/tpt-colour-capi
        run: python -m unittest discover -s tests -v

  book:
    name: Guide (mdBook build and example tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tpt-colour
      - run: python tools/book/test_book.py
      - run: mdbook build docs/book

  semver:
    # Informational for now: the crates are unpublished, so the baseline is the base branch.
    name: Semver check against the base branch (pull requests)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check the public crates
        run: |
          for package in tpt-colour-core tpt-colour-icc tpt-colour-manage tpt-colour; do
            cargo semver-checks check-release --package "$package"               --baseline-rev "${{ github.event.pull_request.base.sha }}"
          done

  bench-regression:
    # Informational: criterion reports the change, and a regression is a warning, not a failure,
    # because CI runners are noisy.
    name: Benchmark regression (pull requests)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the base commit
        run: |
          git checkout "${{ github.event.pull_request.base.sha }}"
          cargo bench -p tpt-colour --bench transform -- --save-baseline base
      - name: Measure the pull request against it
        run: |
          git checkout "${{ github.event.pull_request.head.sha }}"
          cargo bench -p tpt-colour --bench transform -- --baseline base | tee bench.txt
      - name: Warn on regressions
        run: |
          if grep -q "Performance has regressed" bench.txt; then
            echo "::warning::Benchmarks regressed against the base commit. See the bench-regression log."
          fi
