[package]
name = "tpt-colour-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Coverage-guided fuzzing of the ICC parser. Requires Linux or macOS (libFuzzer):
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run icc_parse
# This is a separate workspace so the main workspace builds without nightly.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tpt-colour-core = { path = "../crates/tpt-colour-core" }
tpt-colour-icc = { path = "../crates/tpt-colour-icc" }

[[bin]]
name = "icc_parse"
path = "fuzz_targets/icc_parse.rs"
test = false
doc = false
bench = false


[[bin]]
name = "lut_eval"
path = "fuzz_targets/lut_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transform_full"
path = "fuzz_targets/transform_full.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_css"
path = "fuzz_targets/parse_css.rs"
test = false
doc = false
bench = false

[workspace]
