[package]
name = "tpt-colour-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebAssembly (wasm-bindgen) bindings for tpt-colour"
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["colour", "wasm", "webassembly", "wasm-bindgen", "icc"]
categories = ["wasm", "graphics"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
tpt-colour = { path = "../tpt-colour", version = "0.1.0" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
