[package]
name = "tpt-colour-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Colour spaces, chromatic adaptation, colour difference, and alpha compositing (no_std)"
readme = "README.md"
repository.workspace = true
keywords = ["colour", "color", "oklab", "wcag", "compositing"]
categories = ["graphics", "no-std"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
libm.workspace = true

[dev-dependencies]
# Independent reference for cross-checking our maths in tests only.
palette.workspace = true
