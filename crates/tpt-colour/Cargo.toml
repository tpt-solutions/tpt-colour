[package]
name = "tpt-colour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust colour management: colour spaces, ICC profiles, gamut mapping, and compositing"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
serde = ["tpt-colour-core/serde", "tpt-colour-icc/serde", "tpt-colour-manage/serde"]
simd = ["tpt-colour-manage/simd"]

[dependencies]
tpt-colour-core.workspace = true
tpt-colour-icc.workspace = true
tpt-colour-manage.workspace = true

[dev-dependencies]
serde = { workspace = true }
serde_json = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "transform"
harness = false

[lints]
workspace = true
