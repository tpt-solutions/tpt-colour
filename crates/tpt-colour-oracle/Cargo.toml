[package]
name = "tpt-colour-oracle"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test-only comparison of tpt-colour against LittleCMS reference output"
readme = "README.md"
keywords = ["colour", "littlecms", "icc", "testing", "oracle"]
categories = ["development-tools::testing"]

# Test-only: compares tpt-colour against LittleCMS reference output. Never a dependency of
# shipped crates. The LittleCMS results are stored as fixtures (generated by
# tools/oracle/generate_littlecms.py), so this crate needs no C toolchain.
# Run with: cargo test --manifest-path crates/tpt-colour-oracle/Cargo.toml

[dev-dependencies]
tpt-colour-core = { path = "../tpt-colour-core" }
tpt-colour-icc = { path = "../tpt-colour-icc" }
