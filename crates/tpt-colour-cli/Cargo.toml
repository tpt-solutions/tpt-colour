[package]
name = "tpt-colour-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tool for inspecting ICC profiles, converting colours, and checking gamut"
# Not published yet. Remove this line when the CLI is ready for crates.io.
publish = false
readme = "README.md"
