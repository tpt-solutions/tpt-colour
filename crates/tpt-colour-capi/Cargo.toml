[package]
name = "tpt-colour-capi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "C ABI for tpt-colour, with a cbindgen header"
repository = "https://github.com/tpt-solutions/tpt-colour"
publish = false

# Not part of the workspace: the C ABI needs `unsafe`, which the workspace forbids. Build with
# `cargo build --release` here, and regenerate the header with cbindgen (see README.md).
[workspace]

[lib]
name = "tpt_colour"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tpt = { package = "tpt-colour", path = "../tpt-colour", version = "0.1.0" }
