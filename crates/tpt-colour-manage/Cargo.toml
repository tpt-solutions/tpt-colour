[package]
name = "tpt-colour-manage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gamut mapping, profile management, and HDR tone mapping on top of tpt-colour-icc"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "tpt-colour-icc/serde", "tpt-colour-core/serde"]
simd = ["tpt-colour-icc/simd"]

[dependencies]
serde = { workspace = true, optional = true }
tpt-colour-core.workspace = true
tpt-colour-icc.workspace = true
libm.workspace = true

[dev-dependencies]
# Decodes the golden PNG in tests only; never a dependency of shipped crates.
png = "0.17"
